<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sangeetha's Makeup Artist – Bookings</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--g:#183D32;--gold:#C6A66B;--card:#fff;--tx:#252525;--mut:#6b6b64;--line:#e7e2d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;color:var(--g);margin:0}h1{font-size:2rem}h2{font-size:1.4rem;margin-bottom:12px}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--g);color:#fff;padding:22px 14px;z-index:20;transition:.2s}
aside .brand{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;color:var(--gold);padding:0 10px 22px;line-height:1.15}
aside a{display:flex;gap:10px;align-items:center;color:#dfe8e3;text-decoration:none;padding:11px 12px;border-radius:10px;margin-bottom:4px;cursor:pointer}
aside a.on,aside a:hover{background:rgba(198,166,107,.18);color:var(--gold)}
main{margin-left:240px;padding:28px;max-width:1300px}.top{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:18px 0}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(24,61,50,.07)}
.stat small{color:var(--mut)}.stat b{display:block;font-size:1.6rem;color:var(--g);margin-top:4px}.stat.gold{border-top:3px solid var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{font-size:.85rem;font-weight:600;color:var(--g);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}input[readonly]{background:#f3efe4;font-weight:600}
textarea{min-height:220px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--gold);color:var(--g)}
.btn.g{background:var(--g);color:#fff}.btn.o{background:#fff;border:1px solid var(--g);color:var(--g)}.btn.r{background:#a63a30;color:#fff}.btn.s{padding:5px 10px;font-size:.8rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th{background:var(--g);color:#fff;text-align:left;padding:10px;white-space:nowrap;font-weight:500}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}tr:hover td{background:#fbf9f3}
.pill{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600}.Pending{background:#fbe6e3;color:#a63a30}.Partially{background:#fff1d1;color:#8a6410}.Fully{background:#dcefe4;color:#1b6b45}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.sec{margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal>div{background:#fff;border-radius:16px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;right:18px;bottom:18px;z-index:99;display:grid;gap:8px}#toast div{padding:12px 18px;border-radius:10px;color:#fff;background:var(--g);box-shadow:0 4px 14px rgba(0,0,0,.2)}#toast .e{background:#a63a30}
.ld{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:100}
.warn{background:#fff1d1;border-radius:12px;padding:12px 16px;margin-bottom:14px}.mut{color:var(--mut)}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin:0;padding:16px}.top{display:flex;align-items:center;gap:12px;background:var(--g);color:var(--gold);margin:-16px -16px 16px;padding:12px 16px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.2rem}.top button{background:0;border:0;color:#fff;font-size:1.5rem}}
@media print{aside,.top,.noprint{display:none!important}main{margin:0}}
</style></head><body>
<aside id="nav"></aside><main><div class="top"><button onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button>Sangeetha's Makeup Artist</div><div id="app"></div></main>
<div id="toast"></div><div class="ld" id="ld"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN'),dmy=d=>d?String(d).slice(0,10).split('-').reverse().join('-'):'';
const t12=t=>{if(!t)return'—';let[h,m]=String(t).split(':');const a=h>=12?'PM':'AM';return(h%12||12)+':'+m+' '+a};
const sum=(a,k)=>a.reduce((x,b)=>x+(+b[k]||0),0),today=()=>new Date().toISOString().slice(0,10);
const EV=['Puberty Function','Baby Shower','Engagement','Wedding','Reception','Other'];
const PAGES=[['dashboard','▦ Dashboard'],['new','＋ New Booking'],['bookings','☰ All Bookings'],['tithe','✦ God\'s Tithe'],['reports','▤ Reports'],['settings','⚙ Settings']];
let B=[],F={},editId=null,tithe_view='date';
const pill=s=>`<span class="pill ${String(s).split(' ')[0]}">${s}</span>`;
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),4000)}
function busy(on){$('#ld').style.width=on?'80%':'100%';if(!on)setTimeout(()=>$('#ld').style.width='0',400)}

async function api(body) {
  const u = localStorage.getItem('api');
  const key = localStorage.getItem('apiKey');

  if (!u) throw new Error('Add your Web App URL in Settings first.');
  if (!key) throw new Error('Add your API Key in Settings first.');

  busy(1);
  try {
    const url = u + (u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key);
    const payload = body ? {...body, key} : null;

    const r = body
      ? await fetch(u, {method:'POST', body:JSON.stringify(payload)})
      : await fetch(url);

    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j;
  } finally {
    busy(0);
  }
}

async function load(){try{B=(await api()).bookings;}catch(e){toast(e.message,1)}go()}
function go(){const p=(location.hash||'#dashboard').slice(1);nav.classList.remove('open');
 nav.innerHTML=`<div class="brand">SANGEETHA'S<br>MAKEUP ARTIST</div>`+PAGES.map(x=>`<a class="${x[0]==p?'on':''}" href="#${x[0]}">${x[1]}</a>`).join('');
 $('#app').innerHTML=({dashboard,new:newB,bookings,tithe,reports,settings}[p]||dashboard)();if(p=='new')initForm()}
addEventListener('hashchange',()=>{if(location.hash!='#new')editId=null;go()});

function tbl(h,r){return`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mut">No records yet.</td></tr>`}</table></div>`}
const stat=(l,v,g)=>`<div class="card stat ${g?'gold':''}"><small>${l}</small><b>${v}</b></div>`;
function mini(list){return list.length?tbl(['Date','Customer','Event','Time'],list.map(b=>[dmy(b.date),esc(b.name),esc(b.event),t12(b.time)])):'<p class="mut">Nothing here.</p>'}
function dashboard(){const t=today(),m=t.slice(0,7),s=[...B].sort((a,b)=>a.date<b.date?-1:1);
 return`<h1>Dashboard</h1><div class="cards">${stat('Total Bookings',B.length)}${stat('Total Booking Amount',inr(sum(B,'total')))}${stat('Advance Received',inr(sum(B,'advance')))}${stat('Balance Pending',inr(sum(B,'balance')))}${stat("God's Tithe (1%)",inr(sum(B,'tithe')),1)}</div>
 <div class="grid2"><div class="card"><h2>Today's bookings</h2>${mini(B.filter(b=>b.date==t))}</div><div class="card"><h2>Upcoming</h2>${mini(s.filter(b=>b.date>t).slice(0,6))}</div>
 <div class="card"><h2>This month (${B.filter(b=>b.date.startsWith(m)).length})</h2>${mini(s.filter(b=>b.date.startsWith(m)).slice(0,6))}</div>
 <div class="card"><h2>Recent bookings</h2>${mini([...B].sort((a,b)=>String(b.created)>String(a.created)?1:-1).slice(0,6))}</div></div>`}

function newB(){const d=B.find(b=>b.id==editId)||{};window._d=d;
 return`<h1>${editId?'Edit Booking':'New Booking'}</h1><form id="f" class="card" onsubmit="save(event)" style="margin-top:16px">
 <h2 class="sec">Customer & event</h2><div class="row"><div><label>Event Date *</label><input type="date" id="x_date" required value="${d.date||''}"></div>
 <div><label>Customer Name *</label><input id="x_name" required value="${esc(d.name)}"></div><div><label>Phone Number *</label><input id="x_phone" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" title="10-digit number" required value="${esc(d.phone)}"></div>
 <div><label>Event</label><select id="x_event" onchange="x_oth.style.display=this.value=='Other'?'':'none'">${EV.map(e=>`<option ${(EV.includes(d.event)?d.event:d.event?'Other':'Wedding')==e?'selected':''}>${e}</option>`).join('')}</select></div>
 <div id="x_oth" style="display:${d.event&&!EV.includes(d.event)?'':'none'}"><label>Event name</label><input id="x_other" value="${EV.includes(d.event)?'':esc(d.event)}"></div>
 <div><label>Event Time</label><input type="time" id="x_time" value="${d.time||''}"></div><div><label>Location / Place</label><input id="x_location" value="${esc(d.location)}"></div>
 <div><label>Booking Confirmation</label><select id="x_conf">${['Pending','Confirmed','Cancelled'].map(x=>`<option ${d.confirmation==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <h2 class="sec">Notes</h2><textarea id="x_notes" placeholder="Requirements, makeup preferences, instructions, travel details…">${esc(d.notes)}</textarea>
 <h2 class="sec">Payments</h2><div class="row"><div><label>Total Booking Amount (₹) *</label><input type="number" min="0" id="x_total" required oninput="calc()" value="${d.total??''}"></div>
 <div><label>Advance Received (₹)</label><input id="x_adv" readonly></div><div><label>Balance (₹)</label><input id="x_bal" readonly></div><div><label>Payment Status</label><input id="x_stat" readonly></div></div>
 <div id="x_pays" style="margin-top:12px"></div><button type="button" class="btn o s" onclick="addPay()">＋ Add payment</button>
 <h2 class="sec">Staff earnings</h2><div class="row"><div><label>Sangeetha (₹)</label><input type="number" min="0" id="x_sg" oninput="calc()" value="${d.sangeetha??0}"></div><div><label>Rizwana (₹)</label><input type="number" min="0" id="x_rz" oninput="calc()" value="${d.rizwana??0}"></div><div><label>Combined staff amount</label><input id="x_comb" readonly></div></div>
 <h2 class="sec">God's Tithe</h2><div class="row"><div><label>Tithe (1% of total)</label><input id="x_tith" readonly></div></div>
 <div class="bar" style="margin-top:20px"><button class="btn g" id="x_sv">Save Booking</button>${editId?'<button type="button" class="btn o" onclick="editId=null;location.hash=\'bookings\'">Cancel</button>':''}</div></form>`}
function initForm(){(_d.payments?.length?_d.payments:[{date:today(),amount:''}]).forEach(p=>addPay(p.date,p.amount));calc()}
function addPay(d=today(),a=''){const e=document.createElement('div');e.className='row';e.style.marginBottom='8px';e.innerHTML=`<div><label>Payment date</label><input type="date" class="pd" value="${d}"></div><div><label>Amount (₹)</label><input type="number" min="0" class="pa" oninput="calc()" value="${a}"></div><div style="align-self:end"><button type="button" class="btn r s" onclick="this.closest('.row').remove();calc()">Remove</button></div>`;$('#x_pays').append(e)}
const X=i=>document.getElementById('x_'+i);
function calc(){const t=+X('total').value||0,a=[...document.querySelectorAll('.pa')].reduce((x,i)=>x+(+i.value||0),0);
 X('adv').value=inr(a);X('bal').value=inr(t-a);X('stat').value=t>0&&t-a<=0?'Fully Paid':a>0?'Partially Paid':'Pending';X('tith').value=inr(Math.round(t*1)/100);X('comb').value=inr((+X('sg').value||0)+(+X('rz').value||0))}
async function save(e){e.preventDefault();const t=+X('total').value,pays=[...document.querySelectorAll('#x_pays .row')].map(r=>({date:r.querySelector('.pd').value,amount:+r.querySelector('.pa').value||0})).filter(p=>p.amount>0);
 if(pays.reduce((x,p)=>x+p.amount,0)>t)return toast('Payments exceed the total booking amount.',1);
 const ev=X('event').value=='Other'?(X('other').value.trim()||'Other'):X('event').value,sv=X('sv');sv.disabled=1;sv.textContent='Saving…';
 try{await api({action:'save',booking:{id:editId,date:X('date').value,name:X('name').value.trim(),phone:X('phone').value,event:ev,time:X('time').value,location:X('location').value,notes:X('notes').value,total:t,payments:pays,sangeetha:+X('sg').value||0,rizwana:+X('rz').value||0,confirmation:X('conf').value}});
  toast(editId?'Booking updated.':'Booking saved.');editId=null;await load();location.hash='#dashboard'}catch(x){toast(x.message,1);sv.disabled=0;sv.textContent='Save Booking'}}

function filtered(){return B.filter(b=>(!F.d||b.date==F.d)&&(!F.m||b.date.startsWith(F.m))&&(!F.y||b.date.startsWith(F.y))&&(!F.e||b.event==F.e)&&(!F.s||b.status==F.s)&&(!F.q||b.name.toLowerCase().includes(F.q.toLowerCase()))&&(!F.p||String(b.phone).includes(F.p))).sort((a,b)=>a.date<b.date?1:-1)}
function setF(k,v){F[k]=v;if(k=='q'||k=='p'){bk();return}go()}
function bk(){const l=filtered();$('#bt').innerHTML=bookTable(l)}
function bookTable(l){return`<div class="cards">${stat('Bookings',l.length)}${stat('Amount',inr(sum(l,'total')))}${stat('Balance',inr(sum(l,'balance')))}${stat("God's Tithe",inr(sum(l,'tithe')),1)}</div>`+tbl(['Event Date','Customer','Phone','Event','Time','Location','Amount','Advance','Balance','Sangeetha','Rizwana',"Tithe",'Status','Confirmed','Actions'],l.map(b=>[dmy(b.date),esc(b.name),esc(b.phone),esc(b.event),t12(b.time),esc(b.location),inr(b.total),inr(b.advance),inr(b.balance),inr(b.sangeetha),inr(b.rizwana),inr(b.tithe),pill(b.status),esc(b.confirmation),`<button class="btn g s" onclick="view('${b.id}')">View</button> <button class="btn o s" onclick="edit('${b.id}')">Edit</button> <button class="btn r s" onclick="del('${b.id}')">Delete</button>`]))}
function bookings(){const yrs=[...new Set(B.map(b=>b.date.slice(0,4)))];
 return`<h1>All Bookings</h1><div class="card bar noprint" style="margin-top:14px"><input type="date" style="width:auto" value="${F.d||''}" onchange="setF('d',this.value)"><input type="month" style="width:auto" value="${F.m||''}" onchange="setF('m',this.value)">
 <select style="width:auto" onchange="setF('y',this.value)"><option value="">All years</option>${yrs.map(y=>`<option ${F.y==y?'selected':''}>${y}</option>`).join('')}</select>
 <select style="width:auto" onchange="setF('e',this.value)"><option value="">All events</option>${[...new Set([...EV.slice(0,5),...B.map(b=>b.event)])].map(e=>`<option ${F.e==e?'selected':''}>${esc(e)}</option>`).join('')}</select>
 <select style="width:auto" onchange="setF('s',this.value)"><option value="">All payments</option>${['Pending','Partially Paid','Fully Paid'].map(e=>`<option ${F.s==e?'selected':''}>${e}</option>`).join('')}</select>
 <input style="width:170px" placeholder="Search name" value="${esc(F.q)}" oninput="setF('q',this.value)"><input style="width:150px" placeholder="Search phone" value="${esc(F.p)}" oninput="setF('p',this.value)">
 <button class="btn o s" onclick="F={};go()">Clear filters</button><button class="btn s" onclick="csvOut(filtered(),'filtered-bookings')">Export CSV</button><button class="btn s" onclick="csvOut(B,'all-bookings')">Export Excel</button></div><div id="bt">${bookTable(filtered())}</div>`}
function edit(id){editId=id;location.hash='#new'}
function modal(h){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target==this)this.remove()"><div>${h}</div></div>`}
function detail(b){return`<h2>${esc(b.name)} – ${esc(b.event)}</h2><p>${dmy(b.date)}, ${t12(b.time)} · ${esc(b.location)}<br>Phone: ${esc(b.phone)} · ID: ${b.id} · ${esc(b.confirmation)}</p>
 <p>Total <b>${inr(b.total)}</b> · Advance <b>${inr(b.advance)}</b> · Balance <b>${inr(b.balance)}</b> · Tithe <b>${inr(b.tithe)}</b> ${pill(b.status)}<br>Sangeetha ${inr(b.sangeetha)} · Rizwana ${inr(b.rizwana)}</p>
 <h3>Payment history</h3>${tbl(['Date','Amount'],b.payments.map(p=>[dmy(p.date),inr(p.amount)]))}<h3 style="margin-top:12px">Notes</h3><p style="white-space:pre-wrap">${esc(b.notes)||'—'}</p>`}
function view(id){const b=B.find(x=>x.id==id);modal(detail(b)+`<div class="bar"><button class="btn g" onclick="printB('${id}')">Print</button><button class="btn o" onclick="$('#modal').innerHTML=''">Close</button></div>`)}
function printB(id){const w=open('','_blank');w.document.write(`<html><body style="font-family:sans-serif;max-width:700px;margin:20px auto"><h1>Sangeetha's Makeup Artist</h1>${detail(B.find(x=>x.id==id))}</body></html>`);w.document.close();w.print()}
function del(id){const b=B.find(x=>x.id==id);modal(`<h2>Delete booking?</h2><p>${esc(b.name)} – ${dmy(b.date)}. This also removes its payments and tithe record.</p><div class="bar"><button class="btn r" onclick="doDel('${id}')">Delete</button><button class="btn o" onclick="$('#modal').innerHTML=''">Cancel</button></div>`)}
async function doDel(id){$('#modal').innerHTML='';try{await api({action:'delete',id});toast('Booking deleted.');load()}catch(e){toast(e.message,1)}}
function csvOut(l,n){const h=['Booking ID','Event Date','Customer','Phone','Event','Time','Location','Total','Advance','Balance','Sangeetha','Rizwana','Tithe','Payment Status','Confirmation','Notes'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const c=[h.map(q).join(','),...l.map(b=>[b.id,dmy(b.date),b.name,b.phone,b.event,t12(b.time),b.location,b.total,b.advance,b.balance,b.sangeetha,b.rizwana,b.tithe,b.status,b.confirmation,b.notes].map(q).join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=n+'.csv';a.click()}
function group(len){const g={};B.forEach(b=>{const k=b.date.slice(0,len);g[k]=g[k]||{n:0,t:0,x:0,s:0,r:0,bal:0};g[k].n++;g[k].t+=b.total;g[k].x+=b.tithe;g[k].s+=b.sangeetha;g[k].r+=b.rizwana;g[k].bal+=b.balance});return Object.entries(g).sort().reverse()}
function tithe(){const m=today().slice(0,7),y=today().slice(0,4),sm=a=>sum(a,'tithe');
 const rows=tithe_view=='date'?[...B].sort((a,b)=>a.date<b.date?1:-1).map(b=>[dmy(b.date),esc(b.name),inr(b.total),inr(b.tithe)]):group(tithe_view=='month'?7:4).map(([k,v])=>[tithe_view=='month'?k.split('-').reverse().join('-'):k,v.n+' bookings',inr(v.t),inr(v.x)]);
 return`<h1>God's Tithe</h1><div class="cards">${stat('Overall',inr(sm(B)),1)}${stat('This month',inr(sm(B.filter(b=>b.date.startsWith(m)))),1)}${stat('This year',inr(sm(B.filter(b=>b.date.startsWith(y)))),1)}</div>
 <p class="mut">1% of the full booking amount, never of advances. Calculated automatically.</p><div class="bar">${['date','month','year'].map(v=>`<button class="btn ${tithe_view==v?'g':'o'} s" onclick="tithe_view='${v}';go()">${v}-wise</button>`).join('')}</div>
 <div class="card">${tbl(tithe_view=='date'?['Event Date','Customer','Booking Amount',"God's Tithe (1%)"]:[tithe_view=='month'?'Month':'Year','Bookings','Booking Amount',"God's Tithe (1%)"],rows)}</div>`}
function reports(){return`<h1>Reports</h1><div class="cards">${stat('Sangeetha total earnings',inr(sum(B,'sangeetha')))}${stat('Rizwana total earnings',inr(sum(B,'rizwana')))}${stat('Outstanding balance',inr(sum(B,'balance')))}</div>
 <div class="card"><h2>Monthly report</h2>${tbl(['Month','Bookings','Amount','Balance','Sangeetha','Rizwana',"Tithe"],group(7).map(([k,v])=>[k.split('-').reverse().join('-'),v.n,inr(v.t),inr(v.bal),inr(v.s),inr(v.r),inr(v.x)]))}</div>
 <div class="card" style="margin-top:16px"><h2>Outstanding balances</h2>${tbl(['Event Date','Customer','Phone','Total','Balance','Status'],B.filter(b=>b.balance>0).sort((a,b)=>a.date<b.date?-1:1).map(b=>[dmy(b.date),esc(b.name),esc(b.phone),inr(b.total),inr(b.balance),pill(b.status)]))}
 <div class="bar noprint"><button class="btn s" onclick="csvOut(B.filter(b=>b.balance>0),'outstanding')">Export CSV</button><button class="btn o s" onclick="print()">Print</button></div></div>`}

function settings() {
  return `<h1>Settings</h1>
  <div class="card" style="margin-top:16px;max-width:620px">
    <label>Google Apps Script Web App URL</label>
    <input id="u" placeholder="https://script.google.com/macros/s/…/exec"
      value="${esc(localStorage.getItem('api'))}">

    <label style="margin-top:16px">Private API Key</label>
    <input id="k" type="password" placeholder="Paste your private API key"
      value="${esc(localStorage.getItem('apiKey'))}">

    <p class="mut">Your API key is saved in this browser. Never share it or publish it on GitHub.</p>

    <button class="btn g" onclick="
      localStorage.setItem('api',$('#u').value.trim());
      localStorage.setItem('apiKey',$('#k').value.trim());
      toast('Settings saved. Connecting…');
      load();
    ">Save & connect</button>
  </div>`;
}
